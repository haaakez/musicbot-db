server: 
  port: 2333
  address: 127.0.0.1
lavalink:
  plugins:
    # Pinned upstream development build with the iOS playback fix.
    - dependency: "dev.lavalink.youtube:youtube-plugin:6579cdfd8fbfffad7c95b72fc07ff81c11d9e4de"
      repository: "https://maven.lavalink.dev/snapshots"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.Devoxin:LavaDSPX-Plugin:0.0.5"
      repository: "https://jitpack.io"
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

# These are opt-in: set the matching environment variables before starting Java.
plugins:
  youtube:
    enabled: true
    allowSearch: true
    remoteCipher:
      url: "${YOUTUBE_CIPHER_URL:https://cipher.kikkia.dev/}"
      password: "${YOUTUBE_CIPHER_PASSWORD:}"
      userAgent: "musicbot"
    clients:
      - MUSIC
      - IOS
      - MWEB
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  lavasrc:
    providers:
      - "scsearch:%QUERY%"
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      applemusic: ${APPLE_MUSIC_ENABLED:false}
      deezer: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
    applemusic:
      countryCode: "${APPLE_MUSIC_COUNTRY:US}"
      mediaAPIToken: "${APPLE_MUSIC_TOKEN:}"
