<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Login - Music Bot Admin</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #1e2030; color: #cad3f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      .card { width: 360px; margin: 0 auto; padding: 1.75rem; background: #24273a; border: 1px solid #494d64; box-shadow: 0 0 20px rgba(0, 0, 0, 0.35); }
      h1 { margin-top: 0; margin-bottom: 1rem; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.06em; }
      label { display: block; margin-bottom: 0.35rem; font-weight: 700; color: #cad3f5; }
      input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #494d64; background: #363a4f; color: #cad3f5; }
      button { width: 100%; padding: 0.75rem; border: none; background: #8aadf4; color: #1e2030; font-size: 1rem; cursor: pointer; }
      .error { color: #ed8796; margin-bottom: 1rem; }
      .hint { color: #cad3f5; font-size: 0.95rem; margin-top: 1rem; }
      a { color: #8aadf4; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin Login</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Sign in</button>
      </form>
      <p class="hint">Set ADMIN_USERNAME and ADMIN_PASSWORD in your environment or use the defaults.</p>
    </div>
  </body>
</html>
