<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <title>{{ t('Login - Music Bot Admin') }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="{{ url_for('static', filename='fonts/JetBrainsMono-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  </head>
  <body class="auth">
    <div class="card">
      {% include "_language.html" %}
      <h1>{{ t('Sign in') }}</h1>
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      {% if discord_login_enabled %}
      <form method="get" action="{{ url_for('discord_login') }}">
        <label class="remember-login"><input type="checkbox" name="remember" checked> {{ t('Remember me for {days} days', days=login_days) }}</label>
        <button type="submit">{{ t('Sign in with Discord') }}</button>
      </form>
      <p class="hint">{{ t('Only approved Discord accounts can access this dashboard.') }}</p>
      {% else %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">{{ t('Username') }}</label>
        <input id="username" name="username" type="text" required autofocus autocomplete="username">
        <label for="password">{{ t('Password') }}</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <label class="remember-login"><input type="checkbox" name="remember" checked> {{ t('Remember me for {days} days', days=login_days) }}</label>
        <button type="submit">{{ t('Sign in') }}</button>
      </form>
      {% endif %}
    </div>
  </body>
</html>
